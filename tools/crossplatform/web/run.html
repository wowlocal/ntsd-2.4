<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>NTSD WASI runner</title>
<!-- The browser runner's page (docs/research/TVOS_WEB.md W2a, W2b): fetches
     the run's configuration from web_run.mjs and starts the WASI worker. The
     server sends COOP/COEP headers, so the worker can sleep on a
     SharedArrayBuffer. The page reports to the runner every 5 s, so a
     crashed renderer is noticed, and reports a worker that fails to start.
     With a canvas (the browser host), the worker writes each presented crop
     (XRGB8888) into a shared frame buffer under a sequence lock and the page
     draws the newest one on every animation frame. The first non-black frame
     drawn is read back from the canvas and compared with its source pixels;
     at exit the page posts what it drew and the canvas as a PNG. In an
     interactive run (W2b-2) the page also writes keyboard and mouse events
     and gamepad state into shared memory, and answers the game's questions
     (config.answer answers at once, for automated runs). The page (W2b-4b)
     fits the canvas to the window keeping the game's aspect with nearest
     pixels (as the iOS and SDL hosts scale), shows a loading notice until
     the first frame and, when interactive, a corner bar: full screen (the
     browser's; the game's Alt+Enter stays the game's) and the saves' state
     with a reset. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; flex: none; image-rendering: crisp-edges; image-rendering: pixelated; }
  .bar { position: fixed; top: 8px; right: 8px; display: flex; gap: 6px; transition: opacity .3s; font: 13px system-ui; z-index: 1; }
  .bar.idle { opacity: 0; pointer-events: none; }
  .bar button { background: #ece9d8e0; color: #000; border: 1px solid #0a246a; padding: 3px 9px; font: inherit; cursor: pointer; }
  .panel { position: fixed; top: 40px; right: 8px; max-width: 320px; background: #ece9d8; color: #000; border: 1px solid #0a246a;
           padding: 10px 12px; font: 13px system-ui; z-index: 1; }
  .fetching { position: fixed; left: 8px; bottom: 6px; color: #fffb; font: 12px system-ui; pointer-events: none; text-shadow: 0 0 3px #000; }
  .notice { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font: 18px system-ui; pointer-events: none; }
</style>
<script>
  // A folder's page asked for without its slash (/games/ntsd): its relative URLs need it.
  const moving = !/\/$|\.html?$/.test(location.pathname);   // nothing else runs before the browser moves
  if (moving) location.replace(location.pathname + '/' + location.search + location.hash);
  // The run's configuration is config.json beside the page: the runner
  // (web_run.mjs) serves one and takes the page's reports (config.runner); a
  // static folder (web_app.py, W2b-4c) holds one, and then messages go to the
  // console and the page. Scripts load relative to the page.
  let runner = true;
  const log = text => { if (runner) fetch('/stderr', { method: 'POST', body: text }); else console.warn(text); };
  function shout(text) {   // on the page, for a player
    const box = document.createElement('div'); box.className = 'notice'; box.style.cssText = 'background:#000c;padding:24px;text-align:center';
    box.textContent = text; document.body.append(box);
  }
  const fail = text => {
    (self.ntsdPage ??= {}).exit = 134;   // for the runner's --url steps
    shout(`The game could not start: ${text}`);
    if (runner) fetch('/stderr', { method: 'POST', body: `web_run: ${text}\n` }).finally(() => fetch('/exit?code=134', { method: 'POST' }));
  };
  const query = new URLSearchParams(location.search);
  if (!moving) fetch('config.json').then(r => { if (!r.ok) throw new Error(`config.json: ${r.status}`); return r.json(); }).then(config => {
    runner = config.runner = config.runner === true;   // the worker reports where the page does
    if (runner) setInterval(() => fetch('/alive', { method: 'POST' }), 5000);
    // URLs relative to the page, made absolute for the worker (its own URL is elsewhere).
    config.program = new URL(config.program, location.href).href;
    for (const m of config.mounts) {
      if (m.url) m.url = new URL(m.url, location.href).href.replace(/\/+$/, '');
      if (m.manifest) m.manifest = new URL(m.manifest, location.href).href;
    }
    // An automated start of a static folder: ?autostart, ?answer=N (every question answered N).
    if (query.has('autostart')) config.autostart = true;
    if (query.has('answer')) { config.autostart = true; config.answer = Number(query.get('answer')); }
    if (!self.crossOriginIsolated)
      return fail('the page is not cross-origin isolated (the host must send Cross-Origin-Opener-Policy: same-origin and Cross-Origin-Embedder-Policy: require-corp)');
    const worker = new Worker('wasi-worker.js');
    worker.onerror = e => fail(`worker: ${e.message || e}`);
    if (!config.canvas) return worker.postMessage(config);
    const frames = new SharedArrayBuffer(32 + config.frameBytes), header = new Int32Array(frames, 0, 8);
    const canvas = document.createElement('canvas'); document.body.append(canvas);
    const context = canvas.getContext('2d', { alpha: false });
    // The canvas's box: the whole frame in the window, aspect kept (its pixels
    // stay the frame's; input maps through this box).
    function fit() {
      if (!canvas.width || !canvas.height) return;
      const scale = Math.min(innerWidth / canvas.width, innerHeight / canvas.height);
      canvas.style.width = `${canvas.width * scale}px`; canvas.style.height = `${canvas.height * scale}px`;
    }
    addEventListener('resize', fit);
    document.addEventListener('fullscreenchange', () => {   // the keyboard lock only while in full screen
      fit(); if (!document.fullscreenElement && navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock();
    });
    const report = { draws: 0, torn: 0, check: null };
    self.ntsdPage = { report, header };   // for the runner's DevTools steps
    let shown = 0, image = null, reported = false;   // sequence 0: nothing presented yet
    let loading = null;   // the notice until the first frame
    function draw() {
      const seq = Atomics.load(header, 0);
      if (seq & 1 || seq === shown) return;
      const width = header[1], height = header[2], n = width * height * 4;
      // A size read mid-change can be torn too: never copy past the buffer.
      if (width <= 0 || height <= 0 || 32 + n > frames.byteLength) { report.torn++; return; }
      const source = new Uint8Array(frames, 32, n).slice();   // copy, then confirm it was not overwritten
      // A read-modify-write orders the copy before the re-check (Atomics.load only acquires).
      if (Atomics.compareExchange(header, 0, seq, seq) !== seq) { report.torn++; return; }
      if (canvas.width !== width || canvas.height !== height) { canvas.width = width; canvas.height = height; fit(); }
      if (!image || image.width !== width || image.height !== height) image = new ImageData(width, height);
      const target = image.data;   // 0x00RRGGBB little-endian words: bytes B, G, R, 0
      for (let i = 0; i < n; i += 4) { target[i] = source[i + 2]; target[i + 1] = source[i + 1]; target[i + 2] = source[i]; target[i + 3] = 255; }
      context.putImageData(image, 0, 0);
      shown = seq; report.draws++;
      if (report.draws === 1) report.firstFrameMs = Math.round(performance.now());   // since the page began loading (W3b)
      if (loading) { loading.remove(); loading = null; }
      if (report.check === null && source.some((v, i) => (i & 3) !== 3 && v !== 0)) {
        // Read the page canvas back and compare with the source pixels themselves.
        const back = context.getImageData(0, 0, width, height).data;
        let wrong = 0;
        for (let i = 0; i < n; i += 4) if (back[i] !== source[i + 2] || back[i + 1] !== source[i + 1] || back[i + 2] !== source[i]) wrong++;
        report.check = { width, height, pixels: n / 4, mismatchedPixels: wrong, presentsBefore: Atomics.load(header, 3) };
      }
    }
    async function finish() {
      reported = true;
      try {
        draw();
        const png = runner ? await new Promise(ok => canvas.toBlob(ok, 'image/png')) : null;
        if (png) await fetch('/canvas', { method: 'POST', body: png });
        if (audio) report.audio = audioStats();
        if (kept.length) {   // every change the worker sent, stored (within the worker's 5 s), then for a report what the browser keeps
          const until = performance.now() + 3500, sleep = ms => new Promise(ok => setTimeout(ok, ms));
          while (received < Atomics.load(header, 6) && performance.now() < until) await sleep(10);
          await Promise.race([storing, sleep(Math.max(0, until - performance.now()))]);
          if (config.report && saving) report.kept = await keptSummary().catch(e => ({ error: String(e) }));
        }
        if (runner) await fetch('/page', { method: 'POST', body: JSON.stringify(report) });
        const code = self.ntsdPage.exit = Atomics.load(header, 7);   // the program's exit code
        if (config.interactive && typeof config.answer !== 'number')
          shout(code === 0 ? 'The game has ended. Reload the page to play again.'
                           : `The game stopped (exit code ${code}; details in the browser's console). Reload the page to try again.`);
      } finally { Atomics.store(header, 5, 1); Atomics.notify(header, 5); }
    }
    // Input (W2b-2): the page is the only place with DOM events and the Gamepad
    // API; it writes them into shared memory the worker drains.
    const input = new SharedArrayBuffer(4 * (2 + 256 * 5)), ring = new Int32Array(input);
    const pads = new SharedArrayBuffer(4 * 9), padState = new Int32Array(pads);
    const dialog = new SharedArrayBuffer(8), answer = new Int32Array(dialog);
    const gate = new SharedArrayBuffer(4), fetchGate = new Int32Array(gate);   // W3f: the program's reads first
    // Sound (W2b-3): a ring of stereo Float32 frames the worker fills and
    // web/audio.js plays, made on the player's gesture (browsers allow an
    // AudioContext to run only after one). 44.1 kHz where the browser allows
    // it: the tracks' own rate, and a quarter of the mixing work of a
    // 192 kHz device rate. The ring holds a power of two of frames, at least
    // 0.35 s.
    let audio = null, soundRing = null, audioHeader = null;
    const audioStats = () => audio && { rate: audio.sampleRate, state: audio.state, written: Atomics.load(audioHeader, 0),
                                        played: Atomics.load(audioHeader, 3), underruns: Atomics.load(audioHeader, 2), peak: Atomics.load(audioHeader, 4) / 1e6 };
    self.ntsdAudio = audioStats;   // for a --steps "log": "ntsdAudio()" 
    async function startAudio() {
      try {
        try { audio = new AudioContext({ sampleRate: 44100 }); } catch { audio = new AudioContext(); }
        let capacity = 1024; while (capacity < audio.sampleRate * 0.35) capacity *= 2;
        soundRing = new SharedArrayBuffer(32 + capacity * 2 * 4); audioHeader = new Int32Array(soundRing, 0, 8);
        await audio.audioWorklet.addModule('audio.js');
        const node = new AudioWorkletNode(audio, 'ntsd-ring', { outputChannelCount: [2], processorOptions: { ring: soundRing } });
        node.connect(audio.destination);
        // Never waited on: a gamepad button, a touch or Esc is no activation,
        // and resume() would stay pending. The next click or key resumes it;
        // meanwhile the frames it cannot play are owed to the worker, so the
        // game's music clock keeps time.
        if (audio.state !== 'running') audio.resume().catch(() => {});
        const retry = () => { if (audio.state !== 'running') audio.resume().catch(() => {}); };
        // A touch's pointerdown is no activation on WebKit: its release and click are.
        for (const type of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) addEventListener(type, retry);
        // Elapsed time while not running is owed (within one 20 ms tick of a
        // state change, and on top of what the ring already held: bounded).
        let before = performance.now();
        setInterval(() => {
          const now = performance.now();
          if (audio.state !== 'running' && Atomics.load(audioHeader, 3) + Atomics.load(audioHeader, 0) > 0)
            Atomics.add(audioHeader, 5, Math.round((now - before) / 1000 * audio.sampleRate));
          before = now;
        }, 20);
        return audio.sampleRate;
      } catch (e) { log(`web_run: no sound: ${e}\n`); audio = null; return 0; }
    }
    function push(kind, a, b, c, d) {
      // Counters wrap as Int32 (& 255 indexes them either way). Near full, moves
      // give way so presses and releases are never the ones dropped.
      const write = Atomics.load(ring, 0), pending = (write - Atomics.load(ring, 1)) | 0;
      if (pending >= 256 || (pending >= 192 && kind === 2 && a === 0x200)) return;
      const at = 2 + (write & 255) * 5; ring[at] = kind; ring[at + 1] = a; ring[at + 2] = b; ring[at + 3] = c; ring[at + 4] = d;
      Atomics.store(ring, 0, (write + 1) | 0);
    }
    // KeyboardEvent.code as USB HID usages (OriginalHIDKeys' keys).
    const usage = {};
    for (let i = 0; i < 26; i++) usage['Key' + String.fromCharCode(65 + i)] = 4 + i;
    for (let i = 1; i <= 9; i++) usage['Digit' + i] = 29 + i; usage.Digit0 = 39;
    for (let i = 1; i <= 12; i++) usage['F' + i] = 57 + i;
    for (let i = 1; i <= 9; i++) usage['Numpad' + i] = 88 + i; usage.Numpad0 = 98;
    Object.assign(usage, { Enter: 40, Escape: 41, Backspace: 42, Tab: 43, Space: 44, Minus: 45, Equal: 46, BracketLeft: 47,
      BracketRight: 48, Backslash: 49, Semicolon: 51, Quote: 52, Backquote: 53, Comma: 54, Period: 55, Slash: 56, CapsLock: 57,
      Insert: 73, Home: 74, PageUp: 75, Delete: 76, End: 77, PageDown: 78, ArrowRight: 79, ArrowLeft: 80, ArrowDown: 81, ArrowUp: 82,
      NumpadDivide: 84, NumpadMultiply: 85, NumpadSubtract: 86, NumpadAdd: 87, NumpadEnter: 88, NumpadDecimal: 99,
      ControlLeft: 224, ShiftLeft: 225, AltLeft: 226, ControlRight: 228, ShiftRight: 229, AltRight: 230 });
    const mac = /Mac/.test(navigator.platform);
    let asking = false, caps = false, mouse = 0, last = [0, 0], released = false;
    const held = new Set();   // usages the game was told are down
    function capsFrom(e) {   // true when the Caps Lock state changed
      const on = !!(e.getModifierState && e.getModifierState('CapsLock'));
      if (on === caps) return false;
      caps = on; push(3, on ? 1 : 0, 0, 0, 0); return true;
    }
    // Everything the game holds goes up when the page stops hearing the
    // releases (focus lost, hidden, a question shown), as SDL releases its keys
    // on focus loss: no Alt stuck after Alt+Tab, no character still walking.
    function releaseAll() {
      for (const u of held) push(1, u, 0, 0, caps ? 1 : 0);
      held.clear();
      if (mouse & 1) push(2, 0x202, ...last, mouse &= ~1);
      if (mouse & 2) push(2, 0x205, ...last, mouse &= ~2);
      released = true;
    }
    // The corner bar: full screen and the saves. It fades after 2.5 s without
    // a pointer move; its buttons never keep the focus (Space and Enter are
    // the game's).
    let strip = null, panel = null;
    function button(label, act, parent = strip) {
      const b = document.createElement('button'); b.textContent = label; b.tabIndex = -1;
      b.addEventListener('click', e => { e.preventDefault(); act(b); b.blur(); canvas.focus(); });
      parent.append(b); return b;
    }
    function bar() {
      strip = document.createElement('div'); strip.className = 'bar';
      const root = document.documentElement, enter = root.requestFullscreen || root.webkitRequestFullscreen;
      if (enter) button('Full screen', async () => {
        if (document.fullscreenElement || document.webkitFullscreenElement) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        try {
          await enter.call(root, { navigationUI: 'hide' });
          // Esc stays the game's in full screen where the browser allows it (holding it leaves).
          if (navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock(['Escape']).catch(() => {});
        } catch {}
      });
      document.body.append(strip);
      let idle = null;
      // A hidden bar takes no taps: they reach the game (and wake the bar).
      const wake = () => { strip.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => { if (!panel) strip.classList.add('idle'); }, 2500); };
      addEventListener('pointermove', wake); addEventListener('pointerdown', wake); wake();
    }
    // The saves' button, once their state is known (after the lock and the
    // load): kept, used without saving, unavailable, failed, or not kept.
    function savesButton() {
      if (!kept.length) savesState = 'Saves are not kept: this page has no saves folder, so settings and records last until it closes.';
      button('Saves', () => {
        if (panel) { panel.remove(); panel = null; return; }
        panel = document.createElement('div'); panel.className = 'panel';
        const text = document.createElement('div'); text.textContent = savesState; panel.append(text);
        if (saving) button('Delete the saves and restart', async reset => {
          releaseAll();   // the dialog takes the key releases
          const sure = confirm("Delete this game's saves in this browser (settings, records, recordings) and restart?");
          released = false;   // gamepads count again (a dialog need not blur the page)
          if (!sure || !saving) return;
          saving = false;   // first: nothing the game writes from now on is stored
          await storing; reset.disabled = true;
          try {
            const t = (await opened()).transaction('entries', 'readwrite', { durability: 'strict' });
            for (const m of kept) t.objectStore('entries').delete(under(m.guest));
            await new Promise((ok, no) => { t.oncomplete = ok; t.onerror = t.onabort = () => no(t.error ?? new Error('transaction aborted')); });
            location.reload();
          } catch (e) {
            savesState = `The saves could not be deleted (${e && e.name || e}); saving has stopped until the page is reloaded.`;
            text.textContent = savesState; notice(savesState);
          }
        }, panel).style.marginTop = '8px';
        document.body.append(panel);
      });
    }
    async function start() {
      canvas.tabIndex = 0; canvas.style.touchAction = 'none'; canvas.focus();
      loading = document.createElement('div'); loading.className = 'notice'; loading.textContent = 'Loading…'; document.body.append(loading);
      bar();
      const key = down => e => {
        if (asking || e.metaKey || !(e.code in usage)) return;   // Cmd: the browser's (macOS sends no key-up after it)
        e.preventDefault();
        const changed = capsFrom(e), u = usage[e.code];
        if (mac && e.code === 'CapsLock') {   // one event per toggle there: a whole press, as the SDL host sends
          if (changed) { push(1, u, 1, 0, caps ? 1 : 0); push(1, u, 0, 0, caps ? 1 : 0); }
          return;
        }
        if (!down && !held.has(u)) return;   // a release the game never saw pressed (SDL drops those too)
        let typed = down && e.key.length === 1 ? e.key.codePointAt(0) : 0;
        if (down && e.ctrlKey && !e.altKey && /^[a-z]$/i.test(e.key)) typed = e.key.toUpperCase().charCodeAt(0) & 0x1f;   // Ctrl+letter: its control code
        if (down) held.add(u); else held.delete(u);
        push(1, u, (down ? 1 : 0) | (e.repeat ? 2 : 0), typed, caps ? 1 : 0);
      };
      addEventListener('keydown', key(true)); addEventListener('keyup', key(false));
      // The page's focus is DirectSound's foreground rule for the sound.
      const focus = () => push(4, document.hasFocus() && !document.hidden ? 1 : 0, 0, 0, 0);
      addEventListener('blur', () => { releaseAll(); focus(); }); addEventListener('pagehide', releaseAll);
      addEventListener('focus', () => { released = false; focus(); });
      document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); else released = false; focus(); });
      self.ntsdPage.pointer = () => last;   // the last pointer position in canvas pixels, for the runner's steps
      const point = e => {
        const r = canvas.getBoundingClientRect();
        return [Math.floor((e.clientX - r.left) * canvas.width / r.width), Math.floor((e.clientY - r.top) * canvas.height / r.height)];
      };
      // Button changes as WM_xBUTTONDOWN/UP: browsers report a second button's
      // press or release only in a move's `buttons`. From a move, a press
      // counts only while a press began on the canvas (dragging in from the
      // page with a button held is a move, as on Windows).
      function buttons(e, now, fromMove = false) {
        for (const [bit, down, up] of [[1, 0x201, 0x202], [2, 0x204, 0x205]]) {
          if ((now & bit) === (mouse & bit)) continue;
          if (fromMove && (now & bit) && mouse === 0) continue;
          mouse = (mouse & ~bit) | (now & bit); push(2, now & bit ? down : up, ...last, mouse);
        }
      }
      const state = e => (e.buttons & 1 ? 1 : 0) | (e.buttons & 2 ? 2 : 0);
      canvas.addEventListener('contextmenu', e => e.preventDefault());
      canvas.addEventListener('pointermove', e => {
        if (asking) return; capsFrom(e); last = point(e);
        push(2, 0x200, ...last, mouse); buttons(e, state(e), true);
      });
      canvas.addEventListener('pointerdown', e => {
        canvas.focus(); if (asking) return; capsFrom(e); last = point(e);
        if (e.button === 0 || e.button === 2) canvas.setPointerCapture(e.pointerId);
        push(2, 0x200, ...last, mouse);   // a touch or pen tap moves there first: the game's cursor comes from moves
        buttons(e, state(e));
      });
      canvas.addEventListener('pointerup', e => {
        if (asking) return; last = point(e);
        // A tap's release can come within one game tick of its press: held a
        // little, as the iOS host holds a touch's press.
        if (e.pointerType === 'mouse') buttons(e, state(e)); else setTimeout(() => buttons(e, 0), 80);
      });
      canvas.addEventListener('pointercancel', () => buttons(null, 0));
      if (!config.autostart) focus();   // the state at the start (the host assumes focused; an automated page may lack focus)
      const rate = await startAudio();
      let ready;
      try { ready = await withKept(config); }
      catch (e) {
        saving = false; if (unlock) unlock();
        savesState = `Saves are not available in this browser (${e && e.name || e}): playing without saving.`;
        ready = withoutKept(config); notice(`Saves are not available in this browser (${e && e.name || e}): playing without saving`);
      }
      savesButton();
      worker.postMessage({ ...ready, frames, input, pads, dialog, fetchGate: gate, ...(rate ? { audio: { ring: soundRing, rate } } : {}) });
    }
    // The first two gamepads, each kept in the slot it first took; d-pad over
    // the left stick (standard mapping), A/B/X/Y as buttons 1-4. A pad that
    // goes away reads not connected (the host centres it), as SDL's does.
    const slots = [null, null];
    function samplePads() {
      try {
        const list = navigator.getGamepads ? [...navigator.getGamepads()].filter(p => p && p.connected) : [];
        for (const p of list) if (!slots.includes(p.index) && slots.includes(null)) slots[slots.indexOf(null)] = p.index;
        Atomics.store(padState, 0, slots.filter(s => s !== null).length);
        slots.forEach((index, i) => {
          const p = list.find(q => q.index === index), base = 1 + i * 4;
          if (!p || released || document.hidden) { for (let k = 0; k < 4; k++) Atomics.store(padState, base + k, 0); return; }
          const on = b => !!(p.buttons[b] && p.buttons[b].pressed), standard = p.mapping === 'standard';
          let x = p.axes[0] || 0, y = p.axes[1] || 0;
          if (standard && on(14) !== on(15)) x = on(14) ? -1 : 1;
          if (standard && on(12) !== on(13)) y = on(12) ? -1 : 1;
          const bits = (on(0) ? 1 : 0) | (on(1) ? 2 : 0) | (on(2) ? 4 : 0) | (on(3) ? 8 : 0);
          Atomics.store(padState, base, Math.round(Math.max(-1, Math.min(1, x)) * 32767));
          Atomics.store(padState, base + 1, Math.round(Math.max(-1, Math.min(1, y)) * 32767));
          Atomics.store(padState, base + 2, bits); Atomics.store(padState, base + 3, 1);
        });
      } catch {}
    }
    // Saves (W2b-4a): a mount the page keeps (persist) lives in the browser's
    // IndexedDB, one record per entry keyed by its guest path ({dir, data}).
    // The worker never yields, so it gets the whole tree before it starts and
    // sends each change back (a closed file's bytes, a folder made, a
    // removal, a rename), which the page stores in order, each on disk before
    // the next (strict durability: Chromium's default reports a write done
    // before it is on disk, and lost the last save when the browser was
    // killed). Each file is replaced whole. Without saving (a second tab of
    // the game: a Web Lock, as two snapshots would overwrite each other; or no
    // usable IndexedDB) the mount stays, loaded read-only or empty, and its
    // changes are not stored; the player is told. Boundaries: a change still
    // being stored when the tab closes is lost (milliseconds after the game
    // wrote it); every kept file is loaded at each start; the browser may
    // evict the storage (persist() is asked after the start gesture — Firefox
    // asks the player; Safari caps a site's storage at 7 days without a visit
    // unless the page is a home-screen app); a record whose path runs through
    // a stored file is ignored at load and stays stored. A failure is shown.
    const kept = config.mounts.filter(m => m.persist);
    let saving = kept.length > 0, unlock = null, database = null, storing = Promise.resolve(), received = 0, warned = false;
    let savesState = kept.length ? 'Saves are kept in this browser.' : '';   // what the bar tells the player
    function opened() {   // the connection, opened again after the browser closed it (iOS Safari does)
      return database ??= new Promise((ok, no) => {   // a throw from open() rejects too
        const r = indexedDB.open('ntsd-save', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('entries');
        r.onsuccess = () => { const db = r.result; db.onclose = db.onversionchange = () => { database = null; db.close(); }; ok(db); };
        r.onerror = () => no(r.error);
      }).catch(e => { database = null; throw e; });
    }
    const done = r => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
    const under = key => IDBKeyRange.bound(key + '/', key + '0', false, true);   // the entries inside a folder ('0' follows '/')
    // Kept mounts stay in place (the worker numbers mounts by position), empty.
    const withoutKept = config => ({ ...config, mounts: config.mounts.map(m => (m.persist ? { ...m, entries: [] } : m)) });
    async function entries(guest) {
      const store = (await opened()).transaction('entries').objectStore('entries');
      const [keys, values] = await Promise.all([done(store.getAllKeys(under(guest))), done(store.getAll(under(guest)))]);
      return keys.map((key, i) => ({ path: key.slice(guest.length + 1), dir: values[i].dir, data: values[i].data }));
    }
    async function withKept(config) {   // the config with each kept mount's tree
      if (!kept.length) return config;
      if (navigator.locks) {
        const held = await new Promise(ok => navigator.locks.request('ntsd-save', { ifAvailable: true },
          lock => { ok(!!lock); return lock ? new Promise(done => { unlock = done; }) : undefined; }));   // held while the page lives
        if (!held) {
          saving = false; savesState = 'The game is open in another tab, which keeps the saves: this tab uses them without saving.';
          notice('The game is open in another tab, which keeps the saves: this tab uses them without saving');
        }
      }
      if (saving && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      const mounts = [];
      for (const m of config.mounts) mounts.push(m.persist ? { ...m, entries: await entries(m.guest) } : m);
      return { ...config, mounts };
    }
    function apply(db, m) {
      return new Promise((ok, no) => {
        const t = db.transaction('entries', 'readwrite', { durability: 'strict' }), store = t.objectStore('entries'), key = `${m.guest}/${m.path}`;
        t.oncomplete = ok; t.onerror = t.onabort = () => no(t.error ?? new Error('transaction aborted'));
        if (m.op === 'put') store.put({ dir: false, data: m.data }, key);
        else if (m.op === 'mkdir') store.put({ dir: true, data: null }, key);
        else if (m.op === 'unlink' || m.op === 'rmdir') store.delete(key);
        else if (m.op === 'rename' && m.to !== m.path && !m.to.startsWith(m.path + '/')) {   // replaces the target, as rename does; folders move whole
          const to = `${m.guest}/${m.to}`, move = (from, value) => { store.put(value, to + from.slice(key.length)); store.delete(from); };
          store.delete(to); store.delete(under(to));
          store.get(key).onsuccess = e => { if (e.target.result) move(key, e.target.result); };
          store.openCursor(under(key)).onsuccess = e => { const c = e.target.result; if (c) { move(c.key, c.value); c.continue(); } };
        }
      });
    }
    function keep(m) {
      if (!saving) return;
      storing = storing.then(async () => {
        // Once more on a fresh connection unless the quota is full: an aborted
        // transaction left nothing, and a dropped connection surfaces as
        // InvalidStateError, UnknownError or AbortError.
        try { await apply(await opened(), m); }
        catch (e) { if (e && e.name === 'QuotaExceededError') throw e; database = null; await apply(await opened(), m); }
      }).catch(e => {
        log(`web_run: storing ${m.op} ${m.path}: ${e}\n`);
        if (!warned) { warned = true; savesState = `Saving failed (${e && e.name || e}): the saves may be incomplete.`; notice(`Saving failed (${e && e.name || e}): the game's saves in this browser may be incomplete`); }
      });
    }
    async function keptSummary() {   // guest path → {dir} or {size, sha256}
      const out = {};
      for (const m of kept) for (const e of await entries(m.guest)) {
        const digest = e.dir ? null : new Uint8Array(await crypto.subtle.digest('SHA-256', e.data));
        out[`${m.guest}/${e.path}`] = e.dir ? { dir: true } : { size: e.data.length, sha256: [...digest].map(b => b.toString(16).padStart(2, '0')).join('') };
      }
      return out;
    }
    // A static page's data (W3f): fetched here while the program runs (the
    // worker never yields), the files it reads first first, into the cache its
    // synchronous reads use; progress on the loading notice, then in a corner
    // until done. The program comes first until its first frame: no new fetch
    // starts while it waits on a read (the fetch gate) — else the menu's music
    // waited behind the whole download; afterwards two of the 4 lanes go on
    // regardless, so a program reading ahead of them is not left fetching file
    // by file. 4 at a time leave connections free for its reads (6 per host
    // over HTTP/1.1 in Chromium; tuned on that). They stop when the game ends.
    async function fetchAll(files) {
      const total = files.reduce((n, f) => n + f.size, 0), mb = n => Math.round(n / 1e6);
      let loaded = 0, next = 0, failed = 0;
      const status = document.createElement('div'); status.className = 'fetching'; document.body.append(status);
      const show = () => {
        if (loading) { loading.textContent = `Loading… ${mb(loaded)} / ${mb(total)} MB`; status.textContent = ''; }
        else status.textContent = `Game data ${mb(loaded)} / ${mb(total)} MB`;
        self.ntsdPage.prefetch = `${loaded}/${total}`; report.prefetchFailed = failed;
      };
      const timer = setInterval(show, 200); show();
      const sleep = ms => new Promise(ok => setTimeout(ok, ms));
      async function lane(index) {
        while (next < files.length && !reported) {
          while (Atomics.load(fetchGate, 0) > 0 && (index >= 2 || !report.draws) && !reported) await sleep(20);
          if (next >= files.length || reported) break;   // taken meanwhile, or the game is over
          const f = files[next++];
          let ok = false;
          for (let attempt = 0; attempt < 3 && !ok; attempt++) {
            if (attempt) await sleep(500 * attempt);
            try {
              const r = await fetch(f.url);
              if (r.ok) { await r.arrayBuffer(); ok = true; }
              else { if (r.body) r.body.cancel().catch(() => {}); if (r.status < 500 && r.status !== 408 && r.status !== 429) break; }
            } catch {}
          }
          if (ok) loaded += f.size; else failed++;   // the program fetches it when it reads it
        }
      }
      await Promise.all(Array.from({ length: 4 }, (_, i) => lane(i)));
      clearInterval(timer); show(); status.remove(); report.prefetchDoneMs = Math.round(performance.now());
    }
    // Questions from the worker; an automated run answers config.answer at once.
    function reply(index) { asking = false; released = false; Atomics.store(answer, 1, index); Atomics.store(answer, 0, 1); Atomics.notify(answer, 0); }
    function notice(content) {
      const bar = document.createElement('div'); bar.append(content);
      bar.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#ece9d8;padding:8px 14px;font:14px system-ui;border:1px solid #0a246a';
      document.body.append(bar); setTimeout(() => bar.remove(), 15000);
    }
    worker.onmessage = ({ data: m }) => {
      if (m.kind === 'store') { received++; keep(m); return; }
      if (m.kind === 'exit') {   // without the runner
        if (m.text) { (self.ntsdPage ??= {}).exit = m.code; shout(`The game stopped: ${m.text}`); }
        return;
      }
      if (m.kind === 'progress') { if (m.skipped) self.ntsdPage.prefetch = 'skipped'; return; }   // the worker's probe found no cache hit
      if (m.kind === 'prefetch') { fetchAll(m.files); return; }
      if (m.kind === 'open') {   // a popup not tied to a click is blocked: the player opens it
        const a = document.createElement('a'); a.href = m.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = `Open ${m.url}`;
        notice(a); return;
      }
      if (m.kind !== 'ask') return;
      releaseAll(); asking = true;
      if (typeof config.answer === 'number') {
        log(`web_run: asked ${JSON.stringify(m)}, answered ${config.answer}\n`);
        return reply(config.answer);
      }
      const box = document.createElement('div');
      box.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0008;font:14px system-ui;z-index:2';
      const panel = document.createElement('div');
      panel.style.cssText = 'background:#ece9d8;color:#000;min-width:260px;max-width:480px;border:1px solid #0a246a;box-shadow:2px 2px 8px #000a';
      const title = document.createElement('div'); title.textContent = m.caption;
      title.style.cssText = 'background:#0a246a;color:#fff;padding:4px 8px;font-weight:bold';
      const body = document.createElement('div'); body.textContent = m.text; body.style.cssText = 'padding:16px;white-space:pre-wrap';
      const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:8px;justify-content:center;padding:0 16px 12px';
      m.buttons.forEach((label, i) => {
        const button = document.createElement('button'); button.textContent = label; button.style.minWidth = '72px';
        button.onclick = () => { box.remove(); canvas.focus(); reply(i); };
        row.append(button); if (i === 0) setTimeout(() => button.focus());
      });
      panel.append(title, body, row); box.append(panel); document.body.append(box);
    };
    function tick() { if (reported) return; if (config.interactive) samplePads(); draw(); if (Atomics.load(header, 4) === 1) finish(); }
    (function frame() { if (!reported) requestAnimationFrame(frame); tick(); })();
    setInterval(tick, 50);   // where animation frames are throttled
    if (!config.interactive) withKept(config).then(ready => worker.postMessage({ ...ready, frames, input, pads, dialog, fetchGate: gate }), e => fail(`saves: ${e}`));
    else if (config.autostart) start();
    else {
      // A player's gesture first: browsers show gamepads only after one of
      // their buttons is pressed (the game counts its joysticks once, at
      // launch), and allow sound only after a click or a key.
      const cover = document.createElement('div');
      cover.textContent = 'Press a gamepad button to play with gamepads, or click or press a key to start';
      cover.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:18px system-ui;cursor:pointer';
      document.body.append(cover);
      let begun = false;
      const go = e => { if (begun) return; begun = true; if (e) e.preventDefault(); cover.remove(); start(); };
      cover.addEventListener('pointerdown', go); addEventListener('keydown', go, { once: true });
      (function wait() {
        if (begun) return;
        const pressed = navigator.getGamepads && [...navigator.getGamepads()].some(p => p && p.buttons.some(b => b.pressed));
        if (pressed) go(); else requestAnimationFrame(wait);
      })();
    }
  }).catch(e => fail(`config: ${e}`));
</script>
